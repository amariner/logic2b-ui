name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Full site build: renders every docs/blocks/charts page, which
      # exercises every demo and every registry item end to end — the
      # strongest signal that the registry is actually installable.
      - run: pnpm build

      # Registry integrity (registryDependencies resolve, declared files
      # exist, every @/registry/* import maps to a shipped file, no
      # duplicate item names) + tsc --noEmit on the non-Astro packages.
      - run: pnpm lint

      - run: pnpm test

      # Bundle the native VS Code extension and validate its Marketplace
      # manifest by producing the same unsigned preview VSIX documented for
      # contributors. Publishing remains a separate credentialed release step.
      - run: pnpm package:vscode

      - uses: actions/upload-artifact@v4
        with:
          name: logic2b-ui-vscode-preview
          path: packages/vscode/dist/logic2b-ui.vsix
          if-no-files-found: error

      # Benchmark contract: all rubric points are reachable; runner fixture
      # hashes, time/output termination and observed-build metadata are tested;
      # synthetic fixtures never enter the published leaderboard.
      - run: pnpm --dir benchmarks/agents lint
      - run: pnpm benchmark:agents:test

      # The two non-empty agent fixtures are exact-pinned Vite projects. Install
      # and production-build both; assert the from-empty task really starts empty.
      - run: pnpm --dir benchmarks/agents test:fixtures

      # Build the exact npm tarballs, install them into an isolated consumer,
      # verify CLI help/version and complete an MCP stdio handshake with the
      # published tool list. This catches stale dist and dependency drift.
      - run: pnpm test:release-artifacts

      # Generate a real Vite starter through the public CLI contract, wrap it
      # in a Turbo workspace, install it and production-build the app. This
      # proves the CLI and MCP shared scaffold core remains consumer-ready.
      - run: pnpm --filter logic2b test:scaffold

      # Contract test for the shell-less agent path: materialize the MCP's
      # Next marketing, Vite dashboard and Astro auth starters from the local
      # registry, install them in a temporary workspace and production-build
      # all three. This also type-checks the copied registry source as a real
      # consumer project and enforces the Vite dashboard chunk budgets.
      - run: pnpm --filter @logic2b/mcp test:scaffolds

      # Raw-size guardrails for browser chunks and registry payloads. These are
      # intentionally checked after the production build above, not estimated
      # from source imports.
      - run: pnpm --filter @logic2b/web test:budgets

      # Accessibility gate: 712 hydrated axe analyses over all block previews,
      # component/chart demos, launch docs and 71 prop playgrounds, light + dark,
      # asserting no serious/critical violations. Structural and semantic
      # a11y — accessible names, roles, labels, valid ARIA and keyboard access.
      # Color contrast is owned by the studio's WCAG 2.2 + APCA audit. Runs
      # against the dist/client built above.
      - run: pnpm --filter @logic2b/web exec playwright install --with-deps chromium

      # Exercise the shipped declarative runner, including failures and missing
      # capabilities, independently from the site's component demonstrations.
      - run: pnpm --filter logic2b test:verify-browser

      # Generate an immutable-registry consumer, explicitly install and build
      # it, then verify its production output. The verify command itself never
      # installs dependencies, builds the app or invokes a project script.
      - run: pnpm --filter logic2b consumer:prepare "$RUNNER_TEMP/logic2b-consumer"
      - run: pnpm --dir "$RUNNER_TEMP/logic2b-consumer" install --frozen-lockfile=false
      - run: pnpm --dir "$RUNNER_TEMP/logic2b-consumer" run build
      - run: pnpm --filter logic2b test:consumer "$RUNNER_TEMP/logic2b-consumer" "$RUNNER_TEMP/logic2b-consumer-evidence"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logic2b-consumer-verification
          path: ${{ runner.temp }}/logic2b-consumer-evidence
          if-no-files-found: warn

      # Preserve custom columns, copy and tokens through a second agent request
      # and a real immutable-registry update. Builds are explicit separate steps;
      # check runs the already-built app and retains every stage's evidence.
      - run: pnpm --filter logic2b journey:prepare "$RUNNER_TEMP/logic2b-journey"
      - run: pnpm --dir "$RUNNER_TEMP/logic2b-journey" install --frozen-lockfile=false
      - run: pnpm --filter logic2b journey:build "$RUNNER_TEMP/logic2b-journey"
      - run: pnpm --filter logic2b test:journey "$RUNNER_TEMP/logic2b-journey" "$RUNNER_TEMP/logic2b-journey-customized"
      - run: pnpm --filter logic2b journey:change "$RUNNER_TEMP/logic2b-journey"
      - run: pnpm --filter logic2b journey:build "$RUNNER_TEMP/logic2b-journey"
      - run: pnpm --filter logic2b test:journey "$RUNNER_TEMP/logic2b-journey" "$RUNNER_TEMP/logic2b-journey-changed"
      - run: pnpm --filter logic2b journey:update "$RUNNER_TEMP/logic2b-journey"
      - run: pnpm --filter logic2b journey:build "$RUNNER_TEMP/logic2b-journey"
      - run: pnpm --filter logic2b test:journey "$RUNNER_TEMP/logic2b-journey" "$RUNNER_TEMP/logic2b-journey-updated"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logic2b-customer-change-update
          # These directories contain only the generated synthetic consumer;
          # include its conflict-resolution journal for inspectable evidence.
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/logic2b-journey-customized
            ${{ runner.temp }}/logic2b-journey-changed
            ${{ runner.temp }}/logic2b-journey-updated
            ${{ runner.temp }}/logic2b-journey/journey-artifacts
            ${{ runner.temp }}/logic2b-journey/journey-state.json
          if-no-files-found: warn

      - run: pnpm --filter @logic2b/web exec playwright test tests/beta-onboarding.spec.ts tests/theme-gallery.spec.ts tests/customer-journey.spec.ts tests/verification-docs.spec.ts

      - run: pnpm --filter @logic2b/web test:a11y

      # Pixel-diff gate over every isolated component/chart demo and block,
      # light + dark. Animations and carets are disabled and the comparison
      # allows a small antialiasing tolerance across browser hosts.
      - run: pnpm --filter @logic2b/web test:visual

      # Three desktop Lighthouse runs over the landing, docs and theme studio;
      # assert category scores and Core Web Vitals against the built static site.
      - run: pnpm --filter @logic2b/web test:lighthouse

      # Keep the last browser gate's evidence when any site check fails.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-functional-test-diffs
          path: apps/web/test-results
          if-no-files-found: warn
